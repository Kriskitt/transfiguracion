<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geometric Noise — Transfiguración</title>
  <link rel="stylesheet" href="./noise.css">
  <script type="module" src="./noise.js"></script>
</head>
<body>
  <main class="app">
    <header class="controls" aria-label="Pattern controls">
      <div class="identity">
        <span class="eyebrow">TRANSFIGURACIÓN / EXPERIMENT 02</span>
        <strong>Geometric noise</strong>
      </div>
      <div class="control-group">
        <label class="field seed-field" for="seed"><span>Random seed</span><input id="seed" type="text" value="reference" spellcheck="false" autocomplete="off"></label>
        <button id="regenerate" type="button">Regenerate</button>
      </div>
      <div class="control-group sliders">
        <label class="field" for="density"><span>Cluster density</span><input id="density" type="range" min="0" max="1" step="0.01" value="0.5"></label>
        <label class="field" for="module-size"><span>Module size</span><input id="module-size" type="range" min="0.7" max="1.2" step="0.01" value="1"></label>
      </div>
      <div class="control-group">
        <label class="field" for="preview"><span>Responsive preview</span><select id="preview"><option value="live">Live</option><option value="desktop">1920 × 1080</option><option value="tablet">1024 × 768</option><option value="mobile">390 × 844</option></select></label>
        <label class="compare-toggle" for="comparison"><input id="comparison" type="checkbox"><span>Original / Generated</span></label>
      </div>
    </header>
    <section id="stage" class="stage" aria-label="Geometric pattern preview">
      <figure id="original-panel" class="panel" hidden>
        <figcaption>Original SVG</figcaption>
        <div id="original-frame" class="artboard"><img src="./references/noise.svg" alt="Original geometric composition from noise.svg"></div>
      </figure>
      <figure class="panel">
        <figcaption>Generated <span id="count"></span></figcaption>
        <div id="generated-frame" class="artboard"><canvas id="generated" aria-label="Procedurally generated geometric pattern"></canvas></div>
      </figure>
    </section>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
